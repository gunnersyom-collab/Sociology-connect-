
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Sociology Connect</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#222;}

header{
background:linear-gradient(135deg,#007bff,#0056b3);
color:#fff;
text-align:center;
padding:25px 15px;
}

nav{
background:#fff;
padding:12px;
display:flex;
justify-content:center;
gap:20px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

nav a{
text-decoration:none;
color:#007bff;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
padding:15px;
}

.profile-card{
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,.1);
}

.cover{
height:220px;
background:linear-gradient(135deg,#0d6efd,#4facfe);
}

.profile-photo{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:5px solid #fff;
display:block;
margin:-60px auto 10px;
box-shadow:0 4px 12px rgba(0,0,0,.25);
}

h2{text-align:center;margin-top:10px;}
.email{text-align:center;color:#666;margin-bottom:20px;}

.stats{
display:flex;
justify-content:space-around;
padding:10px 20px 25px;
text-align:center;
}

.stats strong{
display:block;
font-size:32px;
color:#0d6efd;
}

.info{
padding:0 20px;
}

.info-box{
background:#f5f7fb;
padding:16px;
border-radius:12px;
margin-bottom:15px;
}

.info-box strong{
color:#0d6efd;
display:block;
margin-bottom:6px;
}

.edit-section{
margin:20px;
padding-top:20px;
border-top:1px solid #ddd;
}

.edit-section h3{
text-align:center;
margin-bottom:20px;
}

label{
display:block;
margin:12px 0 5px;
font-size:18px;
}

input,select,textarea{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:12px;
font-size:17px;
}

textarea{
min-height:110px;
resize:vertical;
}

button{
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:12px;
background:#0057d9;
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0043a8;
}

footer{
text-align:center;
padding:25px;
color:#777;
}
</style>
</head>

<body>

<header>
<h1>👤 My Profile</h1>
<p>Sociology Connect – Arsi University</p>
</header>

<nav>
<a href="index.html">🏠 Home</a>
<a href="profile.html">👤 Profile</a>
<a href="login.html">🔐 Login</a>
</nav>

<div class="container">

<div class="profile-card">

<div class="cover"></div>

<img id="profilePhoto" class="profile-photo" src="IMG_20260910_154710.png" alt="Profile">

<h2 id="profileName">Student Name</h2>
<div class="email">Sociology & Social Work</div>

<div class="stats">
<div><strong>12</strong>Posts</div>
<div><strong>340</strong>Followers</div>
<div><strong>180</strong>Following</div>
</div>

<div class="info">

<div class="info-box">
<strong>🎓 Year</strong>
<span id="profileYear">Not added</span>
</div>

<div class="info-box">
<strong>📝 Bio</strong>
<span id="profileBio">No bio added yet.</span>
</div>

</div>

<div class="edit-section">

<h3>✏️ Edit Profile</h3>

<label>Full Name</label>
<input id="fullName" type="text" placeholder="Enter your name">

<label>Year</label>
<select id="year">
<option value="">Select your year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
<option>Graduate</option>
</select>

<label>Bio</label>
<textarea id="bio" placeholder="Write something..."></textarea>

<label>Profile Photo URL (Optional)</label>
<input id="photo" type="url" placeholder="Paste image URL">

<button onclick="saveProfile()">💾 Save Profile</button>

</div>

</div>

</div>

<footer>
Sociology Connect © 2026
</footer>

<script>
function loadProfile(){
 const data=JSON.parse(localStorage.getItem("scProfile"))||{};

 document.getElementById("profileName").textContent=data.name||"Student Name";
 document.getElementById("profileYear").textContent=data.year||"Not added";
 document.getElementById("profileBio").textContent=data.bio||"No bio added yet.";

 if(data.photo){
   document.getElementById("profilePhoto").src=data.photo;
 }

 document.getElementById("fullName").value=data.name||"";
 document.getElementById("year").value=data.year||"";
 document.getElementById("bio").value=data.bio||"";
 document.getElementById("photo").value=data.photo||"";
}

function saveProfile(){
 const data={
   name:document.getElementById("fullName").value,
   year:document.getElementById("year").value,
   bio:document.getElementById("bio").value,
   photo:document.getElementById("photo").value
 };

 localStorage.setItem("scProfile",JSON.stringify(data));
 loadProfile();
 alert("Profile updated successfully!");
}

window.onload=loadProfile;
</script>

</body>
</html>
