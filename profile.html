<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Sociology Connect</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#007bff,#0056b3);
    color:white;
    padding:18px 20px;
    text-align:center;
}

header h1{margin:0;font-size:25px;}
header p{margin:6px 0 0;opacity:.9;}

/* NAV */
nav{
    background:white;
    padding:12px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

nav a{
    text-decoration:none;
    color:#007bff;
    font-weight:bold;
    margin:0 10px;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:15px;
}

.profile-card{
    background:white;
    border-radius:18px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

/* COVER PHOTO */
.cover{
    height:180px;
    background:linear-gradient(135deg,#0d6efd,#4facfe);
    border-radius:16px 16px 0 0;
    margin:-30px -20px 0;
}

/* PROFILE PHOTO */
.profile-photo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    margin-top:-60px;
    background:#ddd;
}

.profile-card h2{margin:15px 0 5px;}
.email{color:#777;font-size:14px;}

.stats{
    display:flex;
    justify-content:space-around;
    margin:20px 0;
}

.stats div strong{
    display:block;
    color:#007bff;
    font-size:20px;
}

.info{text-align:left;}

.info-box{
    background:#f7f9fc;
    padding:14px;
    border-radius:10px;
    margin-bottom:12px;
}

.info-box strong{
    display:block;
    color:#007bff;
    margin-bottom:5px;
}

.edit-section{
    margin-top:25px;
    border-top:1px solid #ddd;
    padding-top:25px;
    text-align:left;
}

.edit-section h3{text-align:center;}

input,textarea,select{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:20px;
}

@media(max-width:600px){
    .container{margin:15px auto;}
}
</style>
</head>

<body>

<header>
    <h1>👤 My Profile</h1>
    <p>Sociology Connect – Arsi University</p>
</header>

<nav>
    <a href="index.html">🏠 Home</a>
    <a href="profile.html">👤 Profile</a>
    <a href="login.html">🔐 Login</a>
</nav>

<div class="container">

<div class="profile-card">

<div class="cover"></div>

<img id="profilePhoto" class="profile-photo"
src="default-profile.png" alt="Profile">
<h2 id="profileName">Student Name</h2>
<div class="email" id="profileEmail">student@email.com</div>

<div class="stats">
<div><strong>12</strong>Posts</div>
<div><strong>340</strong>Followers</div>
<div><strong>180</strong>Following</div>
</div>

<div class="info">

<div class="info-box">
<strong>🎓 Year</strong>
<span id="profileYear">Not added</span>
</div>

<div class="info-box">
<strong>📝 Bio</strong>
<span id="profileBio">No bio added yet.</span>
</div>

</div>

<div class="edit-section">

<h3>✏️ Edit Profile</h3>

<label>Full Name</label>
<input id="fullName" type="text"
placeholder="Enter your full name">

<label>Year</label>
<select id="year">
<option value="">Select your year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
<option>Graduate</option>
</select>

<label>Bio</label>
<textarea id="bio"
placeholder="Write something about yourself..."></textarea>

<label>Profile Photo URL</label>
<input id="photo" type="url"
placeholder="Paste image URL">

<button onclick="saveProfile()">
💾 Save Profile
</button>

</div>

</div>

</div>

<footer>
Sociology Connect © 2026
</footer>

<script>
// Load profile
function loadProfile(){

const data=JSON.parse(localStorage.getItem("scProfile"))||{};

document.getElementById("profileName").textContent=data.name||"Student Name";
document.getElementById("profileYear").textContent=data.year||"Not added";
document.getElementById("profileBio").textContent=data.bio||"No bio added yet.";

if(data.photo){
document.getElementById("profilePhoto").src=data.photo;
}

document.getElementById("fullName").value=data.name||"";
document.getElementById("year").value=data.year||"";
document.getElementById("bio").value=data.bio||"";
document.getElementById("photo").value=data.photo||"";
}

// Save profile
function saveProfile(){

const data={
name:document.getElementById("fullName").value,
year:document.getElementById("year").value,
bio:document.getElementById("bio").value,
photo:document.getElementById("photo").value
};

localStorage.setItem("scProfile",JSON.stringify(data));

loadProfile();

alert("Profile updated successfully!");
}

loadProfile();
</script>

</body>
</html>
