<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Sociology Connect</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;padding:20px;color:#222;}
.box{max-width:400px;margin:40px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,.08);}
h2{text-align:center;margin-bottom:20px;color:#007bff;}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;}
button{width:100%;padding:12px;background:#007bff;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px;}
button:hover{background:#0056b3;}
a{display:block;text-align:center;margin-top:15px;color:#007bff;text-decoration:none;}
a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="box">
  <h2>Create Account</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <a href="login.html">Already have an account? Login</a>
</div>

<script type="module" src="auth.js"></script>
</body>
</html>
