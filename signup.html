<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | Sociology Connect</title>
<meta name="description" content="Create your Sociology Connect student account.">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#007bff,#00b4ff);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:430px;
background:#fff;
padding:28px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.logo{text-align:center;margin-bottom:12px;}

.logo img{
width:70px;
height:70px;
object-fit:contain;
}

h2{
text-align:center;
color:#007bff;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#666;
font-size:14px;
margin-bottom:20px;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
font-size:14px;
}

input,select,textarea{
width:100%;
padding:13px;
margin-top:7px;
border:1px solid #ccc;
border-radius:10px;
font-size:15px;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:#007bff;
box-shadow:0 0 0 2px rgba(0,123,255,.15);
}

textarea{
resize:vertical;
min-height:80px;
}

.password-box{
position:relative;
}

.password-box input{
padding-right:50px;
}

.toggle{
position:absolute;
right:14px;
top:50%;
transform:translateY(-25%);
cursor:pointer;
font-size:18px;
}

button{
width:100%;
padding:13px;
margin-top:18px;
background:#007bff;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0056b3;
}

button:disabled{
background:#8bbcff;
cursor:not-allowed;
}

.note{
background:#f1f7ff;
padding:10px;
border-radius:8px;
margin-top:15px;
font-size:13px;
color:#555;
line-height:1.5;
}

.links{
text-align:center;
margin-top:18px;
}

.links a{
display:block;
margin-top:10px;
color:#007bff;
text-decoration:none;
font-weight:bold;
}

.links a:hover{
text-decoration:underline;
}

footer{
text-align:center;
margin-top:18px;
font-size:13px;
color:#777;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
<img src="1781866925745.png" alt="Sociology Connect Logo">
</div>

<h2>Create Account</h2>

<p class="subtitle">
Join Sociology Connect – Arsi University
</p>

<label>Full Name</label>
<input id="fullName" type="text" placeholder="Enter your full name">

<label>Year</label>
<select id="year">
<option value="">Select your year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
<option>Graduate</option>
</select>

<label>Short Bio</label>
<textarea id="bio" placeholder="Tell us a little about yourself..."></textarea>

<label>Email</label>
<input id="email" type="email" placeholder="Enter your email">

<label>Password</label>

<div class="password-box">
<input id="password" type="password" placeholder="Create a password">
<span id="togglePassword" class="toggle">👁️</span>
</div>

<button id="signupBtn">Create Account</button>

<div class="note">
Your account will be used to access posts, comments, academic resources and other Sociology Connect features.
</div>

<div class="links">
<a href="login.html">Already have an account? Login</a>
<a href="index.html">← Back to Home</a>
</div>

<footer>
© 2026 Sociology Connect • Arsi University
</footer>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const passwordInput=document.getElementById("password");
const togglePassword=document.getElementById("togglePassword");
const signupBtn=document.getElementById("signupBtn");

togglePassword.addEventListener("click",()=>{

if(passwordInput.type==="password"){
passwordInput.type="text";
togglePassword.textContent="🙈";
}else{
passwordInput.type="password";
togglePassword.textContent="👁️";
}

});

signupBtn.addEventListener("click",async()=>{

const fullName=document.getElementById("fullName").value.trim();
const year=document.getElementById("year").value;
const bio=document.getElementById("bio").value.trim();
const email=document.getElementById("email").value.trim();
const password=passwordInput.value;

if(!fullName||!year||!email||!password){
alert("Please fill all required fields.");
return;
}

signupBtn.disabled=true;
signupBtn.textContent="Creating...";

try{

const userCredential=
await createUserWithEmailAndPassword(auth,email,password);

await setDoc(doc(db,"users",userCredential.user.uid),{

fullName,
year,
bio,
email,
department:"Sociology & Social Work",
university:"Arsi University",
createdAt:new Date().toISOString()

});

alert("Account created successfully!");

window.location.href="login.html";

}catch(error){

alert(error.message);

}finally{

signupBtn.disabled=false;
signupBtn.textContent="Create Account";

}

});

</script>

</body>
</html>
