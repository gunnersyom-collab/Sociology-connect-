
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | Sociology Connect</title>

<meta name="description" content="Create your Sociology Connect student account.">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#007bff,#00b4ff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:white;
  padding:28px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.logo{
  text-align:center;
  margin-bottom:12px;
}

.logo img{
  width:70px;
  height:70px;
  object-fit:contain;
}

h2{
  text-align:center;
  color:#007bff;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#666;
  font-size:14px;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#007bff;
  box-shadow:0 0 0 2px rgba(0,123,255,.1);
}

textarea{
  resize:vertical;
  min-height:80px;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:50px;
}

.toggle{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-25%);
  cursor:pointer;
  font-size:18px;
}

button{
  width:100%;
  padding:13px;
  margin-top:18px;
  background:#007bff;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0056b3;
}

button:disabled{
  background:#8bbcff;
  cursor:not-allowed;
}

.links{
  text-align:center;
  margin-top:18px;
}

.links a{
  display:block;
  margin-top:10px;
  color:#007bff;
  text-decoration:none;
  font-weight:bold;
}

.links a:hover{
  text-decoration:underline;
}

.note{
  background:#f1f7ff;
  color:#555;
  padding:10px;
  border-radius:8px;
  margin-top:15px;
  font-size:13px;
  line-height:1.5;
}

footer{
  text-align:center;
  margin-top:18px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    <img src="1781866925745.png" alt="Sociology Connect Logo">
  </div>

  <h2>Create Account</h2>

  <p class="subtitle">
    Join Sociology Connect – Arsi University
  </p>

  <label for="fullName">Full Name</label>
  <input
    type="text"
    id="fullName"
    placeholder="Enter your full name"
    autocomplete="name"
  >

  <label for="year">Year</label>
  <select id="year">
    <option value="">Select your year</option>
    <option value="1st Year">1st Year</option>
    <option value="2nd Year">2nd Year</option>
    <option value="3rd Year">3rd Year</option>
    <option value="4th Year">4th Year</option>
    <option value="Graduate">Graduate</option>
  </select>

  <label for="bio">Short Bio</label>
  <textarea
    id="bio"
    placeholder="Tell us a little about yourself..."
  ></textarea>

  <label for="email">Email</label>
  <input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
  >

  <label for="password">Password</label>

  <div class="password-box">

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      autocomplete="new-password"
    >

    <span class="toggle" id="togglePassword">👁️</span>

  </div>

  <button id="signupBtn" onclick="signup()">
    Create Account
  </button>

  <div class="note">
    Your account will be used to access posts, comments,
    academic resources and other Sociology Connect features.
  </div>

  <div class="links">

    <a href="login.html">
      Already have an account? Login
    </a>

    <a href="index.html">
      ← Back to Home
    </a>

  </div>

  <footer>
    © 2026 Sociology Connect • Arsi University
  </footer>

</div>

<script>
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {

  if(passwordInput.type === "password"){

    passwordInput.type = "text";
    togglePassword.textContent = "🙈";

  }else{

    passwordInput.type = "password";
    togglePassword.textContent = "👁️";

  }

});
</script>

<script type="module" src="auth.js"></script>

</body>
</html>
